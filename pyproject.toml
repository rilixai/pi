[project]
name = "pi-jobbench-evaluation"
version = "0.1.0"
description = "Local JobBench evaluation tooling for the Pi source checkout"
requires-python = ">=3.12"
dependencies = [
    # Beaker's hosted runtime installs LiteLLM, which requires OpenAI >=2.20.
    "openai==2.20.0",
    "pandas==2.3.2",
    "openpyxl==3.1.5",
    "python-pptx==1.0.2",
    "pdfplumber==0.11.7",
    "mammoth==1.10.0",
    "xlrd==2.0.2",
    "Pillow==11.3.0",
    "python-docx==1.2.0",
    "scipy==1.16.1",
    "matplotlib==3.10.6",
    "nbformat==5.10.4",
    "nbclient==0.10.2",
    "pydantic==2.12.4",
]

[dependency-groups]
dev = ["beaker-sdk[tracing]==0.6.5"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.uv]
package = false
